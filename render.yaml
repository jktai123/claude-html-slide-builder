services:
  - type: web
    name: line-notion-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn line_notion_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_ACCESS_TOKEN
        sync: false
      - key: NOTION_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTEBOOKLM_ID
        sync: false
